[project]
name = "so-rag"
version = "0.1.0"
description = "Stack Overflow 2013 semantic search pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "chromadb>=0.5.5",
  "rank-bm25>=0.2.2",
  "lxml>=5.2.2",
  "openai>=1.46.0",
  "pyodbc>=5.1.0",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.1",
  "sentence-transformers>=3.0.1",
  "typer>=0.12.5",
  "streamlit>=1.38.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["so_rag*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
